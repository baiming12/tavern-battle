
<div id="tavern_battle_settings" class="tavern-battle-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>⚔️ 酒馆战斗</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <label class="checkbox_label">
        <input id="tb_enabled" type="checkbox">
        <span>启用战斗插件</span>
      </label>

      <label class="checkbox_label">
        <input id="tb_inject_protocol" type="checkbox">
        <span>向剧情模型注入战斗触发协议</span>
      </label>

      <label class="checkbox_label">
        <input id="tb_auto_narrate" type="checkbox">
        <span>战斗结束后自动调用当前模型续写战斗叙事</span>
      </label>

      <label class="checkbox_label">
        <input id="tb_strip_trigger" type="checkbox">
        <span>从聊天正文移除隐藏的 &lt;BATTLE&gt; 数据</span>
      </label>

      <div class="tb-settings-actions">
        <button id="tb_open_editor" class="menu_button">打开数据编辑器</button>
        <button id="tb_test_battle" class="menu_button">测试当前合集场景</button>
      </div>

      <div id="tb_collection_status" class="tb-settings-status">尚未读取合集。</div>

      <details class="tb-protocol-details">
        <summary>当前触发协议</summary>
        <pre id="tb_protocol_preview"></pre>
      </details>
    </div>
  </div>
</div>
